<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web APIs</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .box { padding: 20px; margin-top: 10px; border: 1px solid #ccc; }
        .box h2 { margin-top: 0; }
        input { margin-right: 10px; }
        button { margin-right: 5px; }
        #storage-output, #worker-output { margin-top: 10px; padding: 10px; background-color: #f4f4f4; min-height: 20px; }
    </style>
</head>
<body>

    <h1>Web APIs Playground</h1>

    <!-- 1. Web Storage Example -->
    <div class="box">
        <h2>Web Storage (localStorage & sessionStorage)</h2>
        <input type="text" id="storage-key" placeholder="Enter Key">
        <input type="text" id="storage-value" placeholder="Enter Value">
        <br><br>
        <button id="local-save-btn">Save to localStorage</button>
        <button id="session-save-btn">Save to sessionStorage</button>
        <button id="read-btn">Read from Storage</button>
        <button id="clear-btn">Clear All</button>
        <div id="storage-output"></div>
    </div>

    <!-- 2. Web Worker Example -->
    <div class="box">
        <h2>Web Workers</h2>
        <p>Click "Start Heavy Calculation". This will run a long loop in a background thread. While it's running, the UI will NOT freeze. You can prove this by clicking the "Change UI Color" button.</p>
        <button id="worker-start-btn">Start Heavy Calculation (in Worker)</button>
        <button id="color-change-btn">Change UI Color</button>
        <div id="worker-output">Waiting for worker result...</div>
    </div>


    <script src="index.js"></script>
</body>
</html>
